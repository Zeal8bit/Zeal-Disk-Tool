name: Build and test
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            image: ubuntu:22.04
          - arch: armv7
            platform: linux/arm/v7
            image: debian:bookworm
          - arch: aarch64
            platform: linux/arm64
            image: debian:bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - name: Build GUI, CLI and tests on the target Linux ABI
        run: >-
          docker run --rm --platform '${{ matrix.platform }}'
          -v "$PWD:/src" -w /src '${{ matrix.image }}'
          sh scripts/ci-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zdt-linux-${{ matrix.arch }}
          path: build/release/*.tar.gz
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FLTK
        run: brew install fltk
      - name: Build, test and package
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix fltk)"
          cmake --build build/release --parallel 3
          ctest --test-dir build/release --output-on-failure
          cmake --build build/release --target package
      - uses: actions/upload-artifact@v4
        with:
          name: zdt-macos-${{ matrix.arch }}
          path: build/release/*.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git curl tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-fltk
      - name: Build, test and package native Windows binaries
        shell: msys2 {0}
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release --parallel 3
          ctest --test-dir build/release --output-on-failure
          cmake --build build/release --target package
      - uses: actions/upload-artifact@v4
        with:
          name: zdt-windows-x86_64
          path: build/release/*.zip
          if-no-files-found: error
